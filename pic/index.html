<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery with Full Navigation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
        }
        /* Organized multi-column column grid layout */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
            align-items: start;
        }
        .gallery-item {
            background: #1e1e1e;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: transform 0.2s;
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }
        .gallery-item:hover {
            transform: scale(1.02);
        }
        /* Keeps original thumbnail aspect ratio uncropped */
        .gallery-item img {
            width: 100%;
            height: auto;
            display: block;
        }
        .filename {
            padding: 12px;
            font-size: 14px;
            text-align: center;
            color: #aaa;
            background: #1a1a1a;
            margin-top: auto;
        }
        /* Lightbox Container */
        .lightbox {
            display: none;
            position: fixed;
            z-index: 999;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        /* Lightbox Image Wrapper */
        .lightbox-wrapper {
            position: relative;
            max-width: 85%;
            max-height: 80%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .lightbox-content {
            max-width: 100%;
            max-height: 80vh;
            border-radius: 4px;
            box-shadow: 0 4px 20px rgba(255,255,255,0.1);
        }
        /* Caption Text */
        .lightbox-caption {
            margin-top: 15px;
            font-size: 18px;
            color: #ddd;
            letter-spacing: 0.5px;
            text-align: center;
        }
        /* Close Button */
        .close-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #fff;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            z-index: 1000;
        }
        .close-btn:hover { color: #ff4d4d; }
        /* Navigation Arrows */
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: #fff;
            font-size: 50px;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 5px;
            z-index: 1000;
            transition: background 0.2s;
        }
        .nav-btn:hover { background: rgba(255, 255, 255, 0.2); }
        .prev-btn { left: 20px; }
        .next-btn { right: 20px; }
    </style>
</head>
<body>

    <h1>Photo Gallery</h1>

    <div class="gallery">
        <div class="gallery-item" onclick="openLightbox(0)">
            <img src="DSC05543.JPG" alt="DSC05543.JPG">
            <div class="filename">DSC05543.JPG</div>
        </div>
        <div class="gallery-item" onclick="openLightbox(1)">
            <img src="DSC05961.JPG" alt="DSC05961.JPG">
            <div class="filename">DSC05961.JPG</div>
        </div>
        <div class="gallery-item" onclick="openLightbox(2)">
            <img src="DSC06391.JPG" alt="DSC06391.JPG">
            <div class="filename">DSC06391.JPG</div>
        </div>
    </div>

    <!-- Lightbox Pop-up Modal -->
    <div id="lightbox" class="lightbox">
        <span class="close-btn" onclick="closeLightbox()">&times;</span>
        <span class="nav-btn prev-btn" onclick="changeImage(-1, event)">&#10094;</span>
        <span class="nav-btn next-btn" onclick="changeImage(1, event)">&#10095;</span>
        
        <div class="lightbox-wrapper">
            <img class="lightbox-content" id="lightbox-img" src="" alt="Enlarged view">
        </div>
        <div class="lightbox-caption" id="lightbox-caption">Filename.jpg</div>
    </div>

    <script>
        const items = document.querySelectorAll('.gallery-item');
        let currentIndex = 0;

        function openLightbox(index) {
            currentIndex = index;
            updateLightboxContent();
            document.getElementById('lightbox').style.display = 'flex';
        }

        function closeLightbox() {
            document.getElementById('lightbox').style.display = 'none';
        }

        function updateLightboxContent() {
            const targetItem = items[currentIndex];
            const imgSrc = targetItem.querySelector('img').src;
            const fileName = imgSrc.substring(imgSrc.lastIndexOf('/') + 1);

            document.getElementById('lightbox-img').src = imgSrc;
            document.getElementById('lightbox-caption').textContent = decodeURIComponent(fileName);
        }

        function changeImage(direction, event) {
            event.stopPropagation(); 
            
            currentIndex += direction;
            
            // Loop infinitely around boundaries
            if (currentIndex >= items.length) currentIndex = 0;
            if (currentIndex < 0) currentIndex = items.length - 1;
            
            updateLightboxContent();
        }

        // Close when clicking empty dark background space
        document.getElementById('lightbox').addEventListener('click', function(e) {
            if (e.target === this) closeLightbox();
        });

        // Add keyboard key listening functions
        document.addEventListener('keydown', function(event) {
            if (document.getElementById('lightbox').style.display === 'flex') {
                if (event.key === "Escape") closeLightbox();
                if (event.key === "ArrowLeft") changeImage(-1, event);
                if (event.key === "ArrowRight") changeImage(1, event);
            }
        });
    </script>

</body>
</html>
