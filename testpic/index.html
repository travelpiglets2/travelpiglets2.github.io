<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Portfolio Gallery</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background-color: #fafafa; padding: 40px 20px; }
        .gallery-container { max-width: 1200px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 30px; color: #111; }
        .mosaic-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); grid-auto-rows: 150px; grid-auto-flow: dense; gap: 12px; }
        .gallery-item { position: relative; overflow: hidden; border-radius: 8px; background-color: #eee; }
        .gallery-item img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.3s; }
        .gallery-item:hover img { transform: scale(1.04); }
        .gallery-item.wide { grid-column: span 2; }
        .gallery-item.tall { grid-row: span 2; }
        .gallery-item.big  { grid-column: span 2; grid-row: span 2; }
    </style>
</head>
<body>

<div class="gallery-container">
    <h1>Portfolio Showcase</h1>
    <div class="mosaic-grid" id="gallery-grid"></div>
</div>

<script>
    async function loadGallery() {
        const grid = document.getElementById('gallery-grid');
        
        try {
            // Fetches the file list generated by your background runner
            const response = await fetch('./images/images.json');
            if (!response.ok) throw new Error("Index file not found");
            const images = await response.json();

            const layouts = ['normal', 'wide', 'tall', 'big'];

            images.forEach(filename => {
                const item = document.createElement('div');
                item.classList.add('gallery-item');

                // Auto-layout assignment based on string hash values
                const score = filename.split('').reduce((acc, char) => acc + char.charCodeAt(0), 0);
                const layoutStyle = layouts[score % layouts.length];
                if (layoutStyle !== 'normal') item.classList.add(layoutStyle);

                const image = document.createElement('img');
                image.src = `./images/${filename}`; // Relative fallback loading path
                image.alt = "Portfolio Asset";
                image.loading = "lazy";

                item.appendChild(image);
                grid.appendChild(item);
            });
        } catch (error) {
            console.error('System Load Error:', error);
            grid.innerHTML = "<p style='grid-column: 1/-1; text-align:center; color:#999;'>No items currently populated.</p>";
        }
    }
    loadGallery();
</script>

</body>
</html>
