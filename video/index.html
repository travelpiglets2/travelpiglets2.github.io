<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery with Lightbox</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .gallery-item {
            background: #1e1e1e;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }
        .gallery-item:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 15px rgba(255,255,255,0.1);
        }
        .gallery-item img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
        }
        .filename {
            padding: 12px;
            font-size: 14px;
            text-align: center;
            color: #aaa;
            background: #1a1a1a;
        }
        /* Lightbox Container */
        .lightbox {
            display: none;
            position: fixed;
            z-index: 999;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
        }
        /* Lightbox Image */
        .lightbox-content {
            max-width: 90%;
            max-height: 85%;
            border-radius: 4px;
            box-shadow: 0 4px 20px rgba(255,255,255,0.1);
            animation: fadeIn 0.2s ease-in-out;
        }
        /* Close Button */
        .close-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #fff;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            transition: color 0.2s;
        }
        .close-btn:hover {
            color: #ff4d4d;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <h1>Photo Gallery</h1>

    <div class="gallery">
        <!-- Photo 1 -->
        <div class="gallery-item" onclick="openLightbox(this)">
            <img src="DSC05543.JPG" alt="DSC05543.JPG">
            <div class="filename">DSC05543.JPG</div>
        </div>
        <!-- Photo 2 -->
        <div class="gallery-item" onclick="openLightbox(this)">
            <img src="DSC05961.JPG" alt="DSC05961.JPG">
            <div class="filename">DSC05961.JPG</div>
        </div>
        <!-- Photo 3 -->
        <div class="gallery-item" onclick="openLightbox(this)">
            <img src="DSC06391.JPG" alt="DSC06391.JPG">
            <div class="filename">DSC06391.JPG</div>
        </div>
    </div>

    <!-- Lightbox Popup Modal -->
    <div id="lightbox" class="lightbox" onclick="closeLightbox()">
        <span class="close-btn" onclick="closeLightbox()">&times;</span>
        <img class="lightbox-content" id="lightbox-img" src="" alt="Enlarged view">
    </div>

    <script>
        function openLightbox(element) {
            // Find the image inside the clicked gallery card
            const imgSrc = element.querySelector('img').src;
            // Place it inside the popup box
            document.getElementById('lightbox-img').src = imgSrc;
            // Display the popup container
            document.getElementById('lightbox').style.display = 'flex';
        }

        function closeLightbox() {
            // Hide the popup container
            document.getElementById('lightbox').style.display = 'none';
        }

        // Close lightbox if the user hits the Escape key
        document.addEventListener('keydown', function(event) {
            if (event.key === "Escape") {
                closeLightbox();
            }
        });
    </script>

</body>
</html>
