<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Photo Gallery</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
            align-items: start;
        }
        .gallery-item {
            background: #1e1e1e;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: transform 0.2s;
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }
        .gallery-item:hover {
            transform: scale(1.02);
        }
        .gallery-item img {
            width: 100%;
            height: auto;
            display: block;
            background: #2a2a2a; /* Fallback skeleton while loading */
            min-height: 200px;
        }
        .filename {
            padding: 12px;
            font-size: 14px;
            text-align: center;
            color: #aaa;
            background: #1a1a1a;
            margin-top: auto;
        }
        .lightbox {
            display: none;
            position: fixed;
            z-index: 999;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .lightbox-wrapper {
            position: relative;
            max-width: 85%;
            max-height: 80%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .lightbox-content {
            max-width: 100%;
            max-height: 80vh;
            border-radius: 4px;
            box-shadow: 0 4px 20px rgba(255,255,255,0.1);
        }
        .lightbox-caption {
            margin-top: 15px;
            font-size: 18px;
            color: #ddd;
            text-align: center;
        }
        .close-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #fff;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            z-index: 1000;
        }
        .close-btn:hover { color: #ff4d4d; }
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: #fff;
            font-size: 50px;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 5px;
            z-index: 1000;
        }
        .nav-btn:hover { background: rgba(255, 255, 255, 0.2); }
        .prev-btn { left: 20px; }
        .next-btn { right: 20px; }
    </style>
</head>
<body>

    <h1>Photo Gallery</h1>

    <!-- Container starts completely empty. JavaScript builds it. -->
    <div class="gallery" id="galleryContainer"></div>

    <div id="lightbox" class="lightbox">
        <span class="close-btn" onclick="closeLightbox()">&times;</span>
        <span class="nav-btn prev-btn" onclick="changeImage(-1, event)">&#10094;</span>
        <span class="nav-btn next-btn" onclick="changeImage(1, event)">&#10095;</span>
        
        <div class="lightbox-wrapper">
            <img class="lightbox-content" id="lightbox-img" src="" alt="Enlarged view">
        </div>
        <div class="lightbox-caption" id="lightbox-caption"></div>
    </div>

    <script>
        // CONFIGURATION: Set your numbering rules here
        const START_NUM = 5543; 
        const END_NUM = 5800;   
        const PREFIX = "DSC0";
        const EXTENSION = ".JPG";

        const container = document.getElementById('galleryContainer');
        let imageElements = [];
        let currentIndex = 0;
        let activeCardIndex = 0;

        // 1. Automatically generate layout items into the DOM
        for (let i = START_NUM; i <= END_NUM; i++) {
            const fileName = `${PREFIX}${i}${EXTENSION}`;
            
            const item = document.createElement('div');
            item.className = 'gallery-item';
            // Store a temporary index tracking ID
            item.setAttribute('data-index', activeCardIndex);
            
            const img = document.createElement('img');
            img.src = fileName;
            img.alt = fileName;
            
            const label = document.createElement('div');
            label.className = 'filename';
            label.textContent = fileName;
            
            item.appendChild(img);
            item.appendChild(label);
            container.appendChild(item);

            // Bind click logic
            item.addEventListener('click', function() {
                openLightbox(parseInt(this.getAttribute('data-index')));
            });

            // 2. Hide image cards that don't actually exist in the folder
            img.onerror = function() {
                item.remove();
                reindexGalleryItems();
            };

            activeCardIndex++;
        }

        // Fixes image index positions after non-existent images break sequence
        function reindexGalleryItems() {
            imageElements = document.querySelectorAll('.gallery-item');
            imageElements.forEach((el, newIdx) => {
                el.setAttribute('data-index', newIdx);
            });
        }

        // Initial setup for existing images
        setTimeout(reindexGalleryItems, 100);

        // Lightbox controller operations
        function openLightbox(index) {
            if (imageElements.length === 0) return;
            currentIndex = index;
            updateLightboxContent();
            document.getElementById('lightbox').style.display = 'flex';
        }

        function closeLightbox() {
            document.getElementById('lightbox').style.display = 'none';
        }

        function updateLightboxContent() {
            const targetItem = imageElements[currentIndex];
            const imgSrc = targetItem.querySelector('img').src;
            const fileName = imgSrc.substring(imgSrc.lastIndexOf('/') + 1);

            document.getElementById('lightbox-img').src = imgSrc;
            document.getElementById('lightbox-caption').textContent = decodeURIComponent(fileName);
        }

        function changeImage(direction, event) {
            event.stopPropagation(); 
            currentIndex += direction;
            
            if (currentIndex >= imageElements.length) currentIndex = 0;
            if (currentIndex < 0) currentIndex = imageElements.length - 1;
            
            updateLightboxContent();
        }

        document.getElementById('lightbox').addEventListener('click', function(e) {
            if (e.target === this) closeLightbox();
        });

        document.addEventListener('keydown', function(event) {
            if (document.getElementById('lightbox').style.display === 'flex') {
                if (event.key === "Escape") closeLightbox();
                if (event.key === "ArrowLeft") changeImage(-1, event);
                if (event.key === "ArrowRight") changeImage(1, event);
            }
        });
    </script>

</body>
</html>
